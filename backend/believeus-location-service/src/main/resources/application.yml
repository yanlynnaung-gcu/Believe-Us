server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: believeus-location-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: "${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST:*}"
            protocols: TLSv1.2 TLSv1.3
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDISHOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDISPORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDISPASSWORD:${REDIS_PASSWORD:}}}
      timeout: 3000ms
  jackson:
    serialization:
      write-dates-as-timestamps: false

believeus:
  jwt:
    secret: ${JWT_SECRET:believeus_sacred_couple_jwt_secret_key_2026_super_secure_multi_couple_prod}
    expiration-seconds: 31536000 # 1 year
  redis:
    pubsub:
      enabled: ${REDIS_PUBSUB_ENABLED:false}
      channel: believeus.couple.events
  location:
    trusted-place-radius-meters: 150.0
    stationary-radius-meters: 75.0
    stationary-duration-minutes: 5
    departure-radius-meters: 200.0
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: believeus-backend-sos
    clean-session: false
    keep-alive-seconds: 30
    qos: 1
    embedded:
      enabled: ${MQTT_EMBEDDED_ENABLED:true}
      port: ${MQTT_PORT:1883}
      host: ${MQTT_HOST:0.0.0.0}

# ==============================================================================
# Development Profile (Persistent H2 File-Based Database for Local Testing)
# ==============================================================================
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/believedb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

# ==============================================================================
# Production Profile (PostgreSQL Database Multi-Couple Production Ready)
# ==============================================================================
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:believedb}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
          fetch_size: 50
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDISHOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDISPORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDISPASSWORD:${REDIS_PASSWORD:}}}
      timeout: 3000ms
believeus:
  redis:
    pubsub:
      enabled: ${REDIS_PUBSUB_ENABLED:false}
